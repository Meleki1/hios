[project]
name = "hios"
version = "0.1.0"
description = "Home Intelligence Operating System"
authors = [
    { name = "HIOS Contributors" }
]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "pyright>=1.1",
    "pre-commit>=4.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"