[project]
name = "hios"
version = "0.1.0"
description = "Home Intelligence Operating System"
authors = [
    { name = "HIOS Contributors" }
]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openai>=2.53.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.11",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.4",
    "langgraph-checkpoint-postgres>=2.0.0",
]


[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "pyright>=1.1",
    "pre-commit>=4.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


